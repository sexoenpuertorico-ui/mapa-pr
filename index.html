<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Conecta Puerto Rico</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

header{
  height:60px;
  background:#151515;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

header h1{
  margin:0;
  font-size:21px;
}

button{
  border:0;
  border-radius:7px;
  padding:11px 15px;
  background:#e91e63;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

#map{
  height:calc(100vh - 60px);
  background:#222;
}

.panel{
  display:none;
  position:fixed;
  z-index:3000;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:92%;
  max-width:400px;
  background:#1d1d1d;
  border:1px solid #444;
  border-radius:14px;
  padding:22px;
  box-shadow:0 0 30px #000;
}

.panel h2{
  text-align:center;
  margin-top:0;
}

input{
  width:100%;
  background:#111;
  color:white;
  border:1px solid #444;
  border-radius:7px;
  padding:12px;
  margin:6px 0 12px;
  font-size:15px;
}

.primary{
  width:100%;
  margin-top:5px;
}

.secondary{
  background:#333;
  width:100%;
  margin-top:8px;
}

.close{
  position:absolute;
  right:10px;
  top:8px;
  background:transparent;
  font-size:23px;
  padding:4px 9px;
}

#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:2500;
}

#userArea{
  display:flex;
  align-items:center;
  gap:8px;
}

#userEmail{
  color:#aaa;
  font-size:12px;
}

#status{
  text-align:center;
  min-height:20px;
  color:#aaa;
  font-size:14px;
}
</style>
</head>

<body>

<header>

  <h1>Conecta Puerto Rico</h1>

  <div id="userArea">

    <span id="userEmail"></span>

    <button
      id="loginButton"
      onclick="openPanel('loginPanel')">
      Iniciar sesión
    </button>

    <button
      id="logoutButton"
      onclick="logout()"
      style="display:none">
      Salir
    </button>

  </div>

</header>

<div id="map"></div>

<div id="overlay" onclick="closePanels()"></div>


<!-- LOGIN -->

<div class="panel" id="loginPanel">

  <button class="close" onclick="closePanels()">×</button>

  <h2>Iniciar sesión</h2>

  <input
    id="loginEmail"
    type="email"
    placeholder="Correo electrónico">

  <input
    id="loginPassword"
    type="password"
    placeholder="Contraseña">

  <button
    class="primary"
    onclick="login()">
    Iniciar sesión
  </button>

  <button
    class="secondary"
    onclick="openPanel('registerPanel')">
    Crear cuenta
  </button>

  <p id="loginStatus"></p>

</div>


<!-- REGISTRO -->

<div class="panel" id="registerPanel">

  <button class="close" onclick="closePanels()">×</button>

  <h2>Crear cuenta</h2>

  <input
    id="registerEmail"
    type="email"
    placeholder="Correo electrónico">

  <input
    id="registerPassword"
    type="password"
    placeholder="Contraseña">

  <button
    class="primary"
    onclick="register()">
    Registrarme
  </button>

  <button
    class="secondary"
    onclick="openPanel('loginPanel')">
    Ya tengo cuenta
  </button>

  <p id="registerStatus"></p>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://bmcajgjwsmgziqgxtbzh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_knsVzsdvFBCeJLUBKpcUnQ_GW4U1_DN";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   PANELES
========================= */

function openPanel(id){

  document.getElementById(
    "overlay"
  ).style.display="block";

  document.querySelectorAll(
    ".panel"
  ).forEach(
    p=>p.style.display="none"
  );

  document.getElementById(
    id
  ).style.display="block";
}


function closePanels(){

  document.getElementById(
    "overlay"
  ).style.display="none";

  document.querySelectorAll(
    ".panel"
  ).forEach(
    p=>p.style.display="none"
  );
}


/* =========================
   REGISTRO
========================= */

async function register(){

  const email =
    document.getElementById(
      "registerEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;


  const status =
    document.getElementById(
      "registerStatus"
    );


  if(!email || !password){

    status.textContent =
      "Escribe correo y contraseña.";

    return;
  }


  status.textContent =
    "Creando cuenta...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({
      email:email,
      password:password
    });


  if(error){

    status.textContent =
      error.message;

    return;
  }


  if(data.session){

    status.textContent =
      "Cuenta creada.";

    closePanels();

  }
  else{

    status.textContent =
      "Cuenta creada. Revisa tu correo para confirmar la cuenta.";

  }

}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const status =
    document.getElementById(
      "loginStatus"
    );


  if(!email || !password){

    status.textContent =
      "Escribe correo y contraseña.";

    return;
  }


  status.textContent =
    "Iniciando sesión...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });


  if(error){

    status.textContent =
      error.message;

    return;
  }


  status.textContent =
    "Sesión iniciada.";


  closePanels();

  updateUserInterface(
    data.user
  );

}


/* =========================
   CERRAR SESIÓN
========================= */

async function logout(){

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    alert(error.message);

    return;
  }


  updateUserInterface(
    null
  );

}


/* =========================
   INTERFAZ
========================= */

function updateUserInterface(user){

  const loginButton =
    document.getElementById(
      "loginButton"
    );

  const logoutButton =
    document.getElementById(
      "logoutButton"
    );

  const userEmail =
    document.getElementById(
      "userEmail"
    );


  if(user){

    loginButton.style.display=
      "none";

    logoutButton.style.display=
      "block";

    userEmail.textContent=
      user.email || "";

  }
  else{

    loginButton.style.display=
      "block";

    logoutButton.style.display=
      "none";

    userEmail.textContent=
      "";

  }

}


/* =========================
   COMPROBAR SESIÓN
========================= */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  updateUserInterface(
    data.session
    ? data.session.user
    : null
  );

}


supabaseClient.auth.onAuthStateChange(
  function(event,session){

    updateUserInterface(
      session
      ? session.user
      : null
    );

  }
);


/* =========================
   INICIO
========================= */

checkSession();

</script>

</body>
</html>
