<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta Puerto Rico</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

header{
  height:60px;
  background:#151515;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  position:relative;
  z-index:1000;
}

header h1{
  margin:0;
  font-size:21px;
}

button{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  background:#e91e63;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:hover{opacity:.9}

#map{
  height:calc(100vh - 60px);
  width:100%;
}

/* PANEL */
.panel{
  display:none;
  position:fixed;
  z-index:3000;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:92%;
  max-width:420px;
  max-height:90vh;
  overflow:auto;
  background:#1d1d1d;
  border:1px solid #444;
  border-radius:14px;
  padding:22px;
  box-shadow:0 0 30px #000;
}

.panel h2{
  text-align:center;
  margin-top:0;
}

input,textarea{
  width:100%;
  background:#111;
  color:white;
  border:1px solid #444;
  border-radius:7px;
  padding:12px;
  margin:6px 0 12px;
  font-size:15px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.close{
  position:absolute;
  right:10px;
  top:8px;
  background:transparent;
  font-size:23px;
  padding:4px 9px;
}

.secondary{
  background:#333;
  width:100%;
  margin-top:8px;
}

.primary{
  width:100%;
  margin-top:5px;
}

/* OVERLAY */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:2500;
}

/* PERFIL */
#profilePhoto{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:5px auto 15px;
  background:#333;
  border:2px solid #555;
}

#photoInput{
  display:none;
}

.photoButton{
  display:block;
  width:100%;
  text-align:center;
  background:#333;
  padding:11px;
  border-radius:7px;
  cursor:pointer;
  margin-bottom:15px;
}

/* CHAT */
#chatMessages{
  height:300px;
  overflow-y:auto;
  background:#101010;
  border:1px solid #333;
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
}

.message{
  max-width:82%;
  background:#292929;
  border-radius:10px;
  padding:9px;
  margin:7px 0;
}

.message.mine{
  margin-left:auto;
  background:#e91e63;
}

.message img{
  max-width:100%;
  border-radius:7px;
  display:block;
  margin-top:5px;
}

.voice{
  width:100%;
  margin-top:5px;
}

.chatControls{
  display:flex;
  gap:6px;
  align-items:center;
}

.chatControls input[type=text]{
  margin:0;
  flex:1;
}

.iconButton{
  padding:11px;
  background:#333;
}

#imageChatInput{
  display:none;
}

/* BUSQUEDA */
#searchBox{
  position:fixed;
  top:75px;
  left:15px;
  z-index:1500;
  width:230px;
}

#searchBox input{
  margin:0;
  background:#1d1d1d;
}

.profileCard{
  text-align:center;
}

.profileCard img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:50%;
  background:#333;
  margin-bottom:10px;
}

.small{
  color:#aaa;
  font-size:13px;
}

@media(max-width:600px){
  #searchBox{
    width:180px;
  }

  header h1{
    font-size:18px;
  }

  header{
    padding:0 10px;
  }

  #chatMessages{
    height:250px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Conecta Puerto Rico</h1>

  <button onclick="openPanel('profilePanel')">
    Crear perfil
  </button>
</header>

<div id="searchBox">
  <input
    type="text"
    id="searchInput"
    placeholder="Buscar perfil..."
    oninput="searchProfiles()">
</div>

<div id="map"></div>

<div id="overlay" onclick="closePanels()"></div>

<!-- CREAR PERFIL -->
<div class="panel" id="profilePanel">

  <button class="close" onclick="closePanels()">×</button>

  <h2>Crear perfil</h2>

  <img id="profilePhoto"
       src=""
       alt="Foto de perfil">

  <label class="photoButton">
    📷 Subir foto de perfil
    <input
      id="photoInput"
      type="file"
      accept="image/*"
      onchange="loadProfilePhoto(event)">
  </label>

  <input
    id="profileName"
    type="text"
    maxlength="30"
    placeholder="Nombre o apodo">

  <textarea
    id="profileBio"
    maxlength="160"
    placeholder="Escribe algo sobre ti..."></textarea>

  <button class="primary" onclick="createProfile()">
    Crear perfil
  </button>

</div>

<!-- PERFIL -->
<div class="panel" id="viewProfilePanel">

  <button class="close" onclick="closePanels()">×</button>

  <div class="profileCard">

    <img id="viewPhoto" src="" alt="Perfil">

    <h2 id="viewName"></h2>

    <p id="viewBio"></p>

    <p class="small">
      Perfil anónimo
    </p>

    <button class="primary" onclick="openChat()">
      💬 Abrir chat
    </button>

  </div>

</div>

<!-- CHAT -->
<div class="panel" id="chatPanel">

  <button class="close" onclick="closePanels()">×</button>

  <h2 id="chatTitle">Chat</h2>

  <div id="chatMessages"></div>

  <div class="chatControls">

    <input
      type="text"
      id="chatText"
      placeholder="Escribe un mensaje..."
      onkeydown="if(event.key==='Enter') sendMessage()">

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

  <div class="chatControls" style="margin-top:7px">

    <label class="iconButton">
      🖼️
      <input
        id="imageChatInput"
        type="file"
        accept="image/*"
        onchange="sendImage(event)">
    </label>

    <button
      class="iconButton"
      onclick="startVoice()">
      🎤
    </button>

    <button
      class="iconButton"
      onclick="stopVoice()"
      id="stopVoiceButton"
      style="display:none">
      ⏹️
    </button>

  </div>

  <p class="small" id="voiceStatus"></p>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAPA
========================= */

const map = L.map('map').setView(
  [18.2208,-66.5901],
  9
);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'&copy; OpenStreetMap'
  }
).addTo(map);


/* =========================
   VARIABLES
========================= */

let profiles = [];
let currentProfile = null;
let selectedProfile = null;

let profilePhotoData = "";

let mediaRecorder = null;
let audioChunks = [];


/* =========================
   PANELES
========================= */

function openPanel(id){

  document.getElementById("overlay").style.display="block";

  document.querySelectorAll(".panel").forEach(
    p => p.style.display="none"
  );

  document.getElementById(id).style.display="block";
}

function closePanels(){

  document.getElementById("overlay").style.display="none";

  document.querySelectorAll(".panel").forEach(
    p => p.style.display="none"
  );
}


/* =========================
   FOTO DE PERFIL
========================= */

function loadProfilePhoto(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    profilePhotoData = e.target.result;

    document.getElementById("profilePhoto").src =
      profilePhotoData;
  };

  reader.readAsDataURL(file);
}


/* =========================
   CREAR PERFIL
========================= */

function createProfile(){

  const name =
    document.getElementById("profileName").value.trim();

  const bio =
    document.getElementById("profileBio").value.trim();

  if(!name){

    alert("Escribe un nombre o apodo.");
    return;
  }

  const profile = {

    id:Date.now(),

    name:name,

    bio:bio,

    photo:profilePhotoData,

    lat:18.2208 + (Math.random()-.5)*.5,

    lng:-66.5901 + (Math.random()-.5)*.5

  };

  profiles.push(profile);

  currentProfile = profile;

  addMarker(profile);

  alert("Perfil creado.");

  closePanels();

  document.getElementById("profileName").value="";
  document.getElementById("profileBio").value="";
  document.getElementById("profilePhoto").src="";
  profilePhotoData="";

}


/* =========================
   MARCADORES
========================= */

function addMarker(profile){

  const marker =
    L.marker([profile.lat,profile.lng])
    .addTo(map);

  marker.on("click",function(){

    showProfile(profile);

  });

}


/* =========================
   VER PERFIL
========================= */

function showProfile(profile){

  selectedProfile = profile;

  document.getElementById("viewName").textContent =
    profile.name;

  document.getElementById("viewBio").textContent =
    profile.bio || "Sin descripción.";

  document.getElementById("viewPhoto").src =
    profile.photo || "";

  openPanel("viewProfilePanel");

}


/* =========================
   CHAT
========================= */

function openChat(){

  if(!selectedProfile) return;

  document.getElementById("chatTitle").textContent =
    "Chat con " + selectedProfile.name;

  document.getElementById("chatMessages").innerHTML="";

  closePanels();

  openPanel("chatPanel");

}


function sendMessage(){

  const input =
    document.getElementById("chatText");

  const text = input.value.trim();

  if(!text) return;

  addMessage(text,"mine");

  input.value="";

}


function addMessage(text,type){

  const box =
    document.getElementById("chatMessages");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent=text;

  box.appendChild(message);

  box.scrollTop=box.scrollHeight;

}


/* =========================
   ENVIAR IMAGEN
========================= */

function sendImage(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload=function(e){

    const box =
      document.getElementById("chatMessages");

    const message =
      document.createElement("div");

    message.className="message mine";

    const img =
      document.createElement("img");

    img.src=e.target.result;

    message.appendChild(img);

    box.appendChild(message);

    box.scrollTop=box.scrollHeight;

  };

  reader.readAsDataURL(file);

  event.target.value="";

}


/* =========================
   MENSAJES DE VOZ
========================= */

async function startVoice(){

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    alert("Tu navegador no permite grabar audio.");

    return;
  }

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    audioChunks=[];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
      function(event){

        if(event.data.size>0){

          audioChunks.push(event.data);

        }

      };

    mediaRecorder.onstop =
      function(){

        const audioBlob =
          new Blob(
            audioChunks,
            {type:"audio/webm"}
          );

        const audioURL =
          URL.createObjectURL(audioBlob);

        const box =
          document.getElementById("chatMessages");

        const message =
          document.createElement("div");

        message.className="message mine";

        const audio =
          document.createElement("audio");

        audio.controls=true;

        audio.className="voice";

        audio.src=audioURL;

        message.appendChild(audio);

        box.appendChild(message);

        box.scrollTop=box.scrollHeight;

        stream.getTracks().forEach(
          track=>track.stop()
        );

      };

    mediaRecorder.start();

    document.getElementById(
      "stopVoiceButton"
    ).style.display="block";

    document.getElementById(
      "voiceStatus"
    ).textContent="Grabando... toca ⏹️ para terminar.";

  }
  catch(error){

    alert("No se pudo acceder al micrófono.");

  }

}


function stopVoice(){

  if(mediaRecorder &&
     mediaRecorder.state!=="inactive"){

    mediaRecorder.stop();

  }

  document.getElementById(
    "stopVoiceButton"
  ).style.display="none";

  document.getElementById(
    "voiceStatus"
  ).textContent="";

}


/* =========================
   BUSCAR PERFILES
========================= */

function searchProfiles(){

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  profiles.forEach(profile=>{

    if(
      profile.name
      .toLowerCase()
      .includes(search)
    ){

      // Los perfiles existentes permanecen
      // visibles en el mapa.

    }

  });

}

</script>

</body>
</html>
