<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sexo Puerto Rico</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      height: 60px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    button {
      background: #e91e63;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    #map {
      width: 100%;
      height: calc(100vh - 60px);
    }

    .profile-marker {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      border: 3px solid #e91e63;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .profile-card {
      text-align: center;
      color: #222;
      min-width: 150px;
    }

    .profile-card h3 {
      margin: 5px 0;
    }

    .profile-card p {
      margin: 5px 0 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Sexo Puerto Rico</h1>
    <button onclick="login()">Iniciar sesión</button>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([18.2208, -66.5901], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const perfiles = [
      {
        nombre: "Alex",
        edad: 28,
        ciudad: "San Juan",
        posicion: [18.4655, -66.1057]
      },
      {
        nombre: "Chris",
        edad: 31,
        ciudad: "Bayamón",
        posicion: [18.3808, -66.1532]
      },
      {
        nombre: "Sam",
        edad: 26,
        ciudad: "Ponce",
        posicion: [18.0111, -66.6141]
      },
      {
        nombre: "Jordan",
        edad: 30,
        ciudad: "Mayagüez",
        posicion: [18.2011, -67.1396]
      }
    ];

    perfiles.forEach(perfil => {

      const icono = L.divIcon({
        className: "",
        html: '<div class="profile-marker">🙂</div>',
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });

      const marcador = L.marker(perfil.posicion, {
        icon: icono
      }).addTo(map);

      marcador.bindPopup(`
        <div class="profile-card">
          <h3>${perfil.nombre}</h3>
          <p>${perfil.edad} años</p>
          <p>${perfil.ciudad}</p>
          <button onclick="abrirChat('${perfil.nombre}')">
            Chat
          </button>
        </div>
      `);
    });

    function login() {
      alert("La función de inicio de sesión la añadiremos después.");
    }

    function abrirChat(nombre) {
      alert("Chat con " + nombre + " — próximamente.");
    }
  </script>

</body>
</html>
